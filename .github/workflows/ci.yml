name: CI

# Push/PR test workflow (1.1.0-pre.3, 3.2.1). Runs `bash build.sh test` on every
# push to main and on pull requests so regressions are caught in CI, not locally.
#
# Notes:
#   * g++ / python3 are installed explicitly — `build.sh` falls back to an empty
#     locale branch when Python is missing, which must not happen in CI.
#   * `build.sh test*` now propagates the test-suite exit code, so a failing test
#     fails the job (and the release gate that depends on this workflow).
#   * 1.4.3 adds two man-page gates: a static roff lint inside the ubuntu job and
#     a dedicated `man-pages` render job.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Ubuntu: full suite (unit + integration) ───────────────────────────────
  ubuntu:
    name: Ubuntu (g++) — test-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3 groff man-db

      # 1.4.3: `man/` holds hand-written roff. Lint it statically before the slow
      # build, and gate CLI/config drift with scripts/check_man_sync.py. The grep
      # checks cover the character traps that groff cannot warn about — see
      # plans/1.4.x/1.4.3.md §3.6 for the rationale of each one.
      - name: Man pages: static lint
        run: |
          set -euo pipefail
          groff -man -Tutf8 -z -ww man/ezmk.1 man/ezmk.toml.5
          echo "OK: groff reports no warnings"

          fail=0
          if grep -q $'\r' man/ezmk.1 man/ezmk.toml.5; then
            echo "FAIL: CR byte in a man source (keep the files LF-only)" >&2; fail=1
          fi
          if grep -v -e '^\.TH' -e '^\.\\"' man/ezmk.1 man/ezmk.toml.5 | grep -nP '(?<!\\)-'; then
            echo "FAIL: unescaped hyphen (write \\- so the output stays copy-pasteable)" >&2; fail=1
          fi
          if grep -n -e '\^' -e '~' man/ezmk.1 man/ezmk.toml.5; then
            echo "FAIL: raw ^ or ~ (use \\(ha / \\(ti; utf8 renders the raw forms as U+02C6 / U+02DC)" >&2; fail=1
          fi
          if grep -nF '\\' man/ezmk.1 man/ezmk.toml.5; then
            echo "FAIL: double backslash in a macro argument (use \\e)" >&2; fail=1
          fi
          if grep -v '^\.\\"' man/ezmk.1 man/ezmk.toml.5 | grep -nF '\"'; then
            echo "FAIL: backslash-quote starts a roff comment and swallows the rest of the line" >&2; fail=1
          fi
          if grep -nE '^\.(B|BR|BI|RB) [A-Za-z_]+ = "' man/ezmk.1 man/ezmk.toml.5; then
            echo "FAIL: bare quote in a tag (macro arguments eat it; use \\(dq)" >&2; fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "OK: man static checks passed"

      - name: Man pages: CLI drift gate
        run: python3 scripts/check_man_sync.py

      - name: Build + run all tests
        run: bash build.sh test-all 2>&1 | tee test-report.log

      # 1.2.3: bootstrap-verify the six built-in examples — `ezmk example <name>`
      # then build/test each. GitHub-hosted runners have full outbound network,
      # so with-packages installs fmt and with-tests installs catch2. The runner
      # is a clean environment: register the official repo first.
      - name: Bootstrap-verify built-in examples (1.2.3)
        run: |
          set -euo pipefail
          EZMK="$GITHUB_WORKSPACE/build/ezmk"
          "$EZMK" repo add -u https://github.com/3667808244/ezmk-repo.git --name official
          cd "$RUNNER_TEMP"
          for name in hello greeter with-hooks cmake-interop; do
            "$EZMK" example "$name"
            (cd "$name" && "$EZMK" build)
            echo "OK: example $name builds"
          done
          "$EZMK" example with-tests
          (cd with-tests && "$EZMK" pkg install catch2 -p -y && "$EZMK" test)
          echo "OK: example with-tests passes"
          "$EZMK" example with-packages
          (cd with-packages && "$EZMK" pkg install fmt -p -y && "$EZMK" build)
          echo "OK: example with-packages builds"

      # 1.3.0-dev.3: workspace smoke — topological build + cross-member
      # incremental + clean, against a clean 3-member workspace in RUNNER_TEMP
      # (no repo/network dependency; members are minimal local projects).
      - name: Workspace smoke (1.3.0-dev.3)
        run: |
          set -euo pipefail
          export EZMK_LANG=en   # deterministic cache-summary output for the grep below
          EZMK="$GITHUB_WORKSPACE/build/ezmk"
          WS="$RUNNER_TEMP/ws-smoke"
          rm -rf "$WS"
          mkdir -p "$WS/apps/a/src" "$WS/apps/b/src" "$WS/libs/l/src" "$WS/libs/l/include"
          printf '[workspace]\nmembers = ["apps/a", "apps/b", "libs/l"]\n' > "$WS/ezmk-workspace.toml"
          printf '[project]\nname = "l"\ntype = "static"\nversion = "0.1.0"\n' > "$WS/libs/l/ezmk.toml"
          cat > "$WS/libs/l/include/l.hpp" <<'EOF'
          #pragma once
          namespace l { int val(); }
          EOF
          cat > "$WS/libs/l/src/l.cpp" <<'EOF'
          #include "l.hpp"
          namespace l { int val() { return 7; } }
          EOF
          for app in a b; do
            printf '[project]\nname = "%s"\ntype = "executable"\nversion = "0.1.0"\n\n[depends]\nworkspace = ["l"]\n' "$app" > "$WS/apps/$app/ezmk.toml"
            cat > "$WS/apps/$app/src/main.cpp" <<'EOF'
          #include "l.hpp"
          #include <cstdio>
          int main() { std::printf("v=%d\n", l::val()); return 0; }
          EOF
          done
          cd "$WS"
          "$EZMK" workspace list
          "$EZMK" workspace build -j 3
          # Second build must be fully cached — no member recompiles (lib
          # artifact + headers unchanged → dependents untouched).
          if "$EZMK" workspace build -j 3 2>&1 | grep -qE "[1-9] compiled"; then
            echo "FAIL: second workspace build recompiled something" >&2
            exit 1
          fi
          test -f apps/a/build/a.exe -o -f apps/a/build/a   # artifact landed
          "$EZMK" workspace clean
          echo "OK: workspace smoke passed"

      - name: Emit test report on failure
        if: failure()
        run: |
          if [ -f test-report.log ]; then
            echo "::error::=== test-report.log (last 30 lines) ==="
            tail -n 30 test-report.log | cut -c1-250 | while IFS= read -r line; do
              [ -n "$line" ] && printf '::error::%s\n' "$line"
            done
          else
            echo "::error::(test-report.log not found)"
          fi

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-ubuntu
          path: test-report.log

  # ── Windows (MSYS2): unit tests ──────────────────────────────────────────
  windows:
    name: Windows (MSYS2 g++) — test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            git
          update: true

      - name: Build + run unit tests
        shell: msys2 {0}
        run: bash build.sh test 2>&1 | tee test-report.log

      - name: Emit test report on failure
        if: failure()
        shell: msys2 {0}
        run: |
          if [ -f test-report.log ]; then
            echo "::error::=== test-report.log (last 30 lines) ==="
            tail -n 30 test-report.log | cut -c1-250 | while IFS= read -r line; do
              [ -n "$line" ] && printf '::error::%s\n' "$line"
            done
          else
            echo "::error::(test-report.log not found)"
          fi

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-windows
          path: test-report.log

  # ── zsh completions: install.sh regression (3.2.3) ──────────────────────
  # The install.sh zsh block was fixed in pre.3 (precise marker match +
  # ZDOTDIR support). This job replicates those steps and verifies the outcome
  # in a real zsh, since Windows cannot run zsh.
  zsh-completions:
    name: zsh completions (install.sh 3.2.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Verify install.sh zsh-completion steps
        run: |
          set -euo pipefail

          # Replicate the zsh-completion block of install.sh (see install.sh:
          # "zsh completions" section) so a PR cannot silently regress 3.2.3.
          COMP_DIR="$HOME/.zsh/completions"
          mkdir -p "$COMP_DIR"
          cp res/ezmk.zsh "$COMP_DIR/_ezmk"

          # Honor ZDOTDIR: zsh sources $ZDOTDIR/.zshrc (defaults to $HOME/.zshrc).
          export ZDOTDIR="$HOME/.zdot-test"
          mkdir -p "$ZDOTDIR"
          ZSHRC="$ZDOTDIR/.zshrc"
          touch "$ZSHRC"

          # Same idempotent marker logic as install.sh.
          install_block() {
            if ! grep -qF '# Added by EazyMake installer' "$ZSHRC"; then
              {
                echo ''
                echo '# Added by EazyMake installer'
                echo 'fpath=(~/.zsh/completions $fpath)'
                echo 'autoload -Uz compinit && compinit'
              } >> "$ZSHRC"
            fi
          }
          install_block   # first install
          install_block   # re-run — must be a no-op (idempotency)
          copies=$(grep -c '# Added by EazyMake installer' "$ZSHRC")
          [ "$copies" -eq 1 ] || { echo "FAIL: marker duplicated ($copies copies)" >&2; exit 1; }

          # Fresh zsh: compinit must register _ezmk from fpath. Force the
          # autoload so the check is deterministic.
          zsh -c 'source "$ZDOTDIR/.zshrc"; autoload -Uz _ezmk; whence -w _ezmk' | grep -q 'function' \
            || { echo "FAIL: _ezmk completion not registered by compinit" >&2; exit 1; }

          echo "OK: zsh completion install verified (marker idempotent + _ezmk loadable)"

  # ── Man pages (1.4.3): render check ───────────────────────────────────────
  # The static lint above is not enough: `.TP`-tag and literal-block layout
  # problems only show up once the page is rendered (phase 1 of 1.4.3 found
  # `[options]` falling into the description column that way).
  # Distribution assertions (install.sh / PKGBUILD / release assets / Homebrew
  # formula) are added by 1.4.3 phase 5.
  man-pages:
    name: man pages (1.4.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install groff + man-db
        run: |
          sudo apt-get update
          sudo apt-get install -y groff man-db

      - name: Render both pages
        run: |
          set -euo pipefail
          for page in man/ezmk.1 man/ezmk.toml.5; do
            out="/tmp/$(basename "$page").txt"
            err="/tmp/$(basename "$page").err"
            MANWIDTH=80 MANPAGER=cat PAGER=cat man --warnings -l "$page" >"$out" 2>"$err"
            echo "rendered $page: $(wc -l <"$out") lines"
            # grotty 1.23 emits one device-level 'sgr 0' notice per page (stock
            # system pages trigger it too); anything else is a real warning.
            if grep -v "unrecognized X command 'sgr 0' ignored" "$err" | grep -q .; then
              cat "$err" >&2; exit 1
            fi
          done
          grep -q '^NAME' /tmp/ezmk.1.txt
          grep -q '^SECTIONS' /tmp/ezmk.toml.5.txt
          echo "OK: both man pages render"
