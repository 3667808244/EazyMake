[project]
name = "with-tests"
type = "executable"
version = "0.1.0"
language = "C++17"

[compile]
flags = ["-Wall", "-Wextra"]
default_profile = "debug"
include_dirs = ["include"]

[compile.profile.debug]
flags = ["-g", "-O0"]

[compile.profile.release]
flags = ["-O2", "-DNDEBUG"]

[link]
flags = []
link_dirs = []
system_target = []

# 测试框架依赖（教程 09「测试你的项目」）：ezmk test 会使用 catch2 包提供的
# 实现（libcatch2.a）；主程序由 ezmk test 自动生成（Catch2 v3 兼容）。
[depends]
lib = ["catch2"]

# 测试配置：测试源码在 test/，框架为 Catch2（默认框架）。
[test]
dirs = ["test"]
framework = "catch2"
